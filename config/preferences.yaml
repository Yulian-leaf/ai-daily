# 用户偏好。在 fork 中改这个文件。
keywords:
  - protein structure prediction
  - molecular dynamics
  - drug discovery
  - materials design
  - climate modeling
  - partial differential equations
  - scientific machine learning
  - AI for Science

# AI4S 子领域分类。scorer 会把每条内容归到其中一个 field（用 key 标识），
# 前端据此做「按子领域分类导航」。label 是界面显示名。
subfields:
  - key: protein
    label: 蛋白质/结构
  - key: drug
    label: 药物发现
  - key: molsim
    label: 分子模拟
  - key: materials
    label: 材料科学
  - key: climate
    label: 气候地球
  - key: ai4math
    label: AI4Math/PDE
  - key: scifm
    label: 科学基础模型
  - key: bioinfo
    label: 生物信息

# 抓取窗口（小时）。默认抓最近 7 天的内容。
fetch_window_hours: 168

# LLM 选型。默认平衡预设（spec 第 6.3 节）。
# 其他预设见 README:
#   省钱党:   scorer=deepseek/deepseek-chat  summarizer=deepseek/deepseek-chat
#   品质党:   scorer=anthropic/claude-sonnet-4-6 summarizer=anthropic/claude-opus-4-7
#   中文混搭: scorer=deepseek/deepseek-chat  summarizer=anthropic/claude-sonnet-4-6
models:
  scorer:     deepseek/deepseek-chat   # 评分阶段：每天跑 70+ 次，用便宜模型
  summarizer: deepseek/deepseek-chat   # 总结阶段：每天跑 10 次，用强模型保证质量

# 评分阈值：score >= score_threshold 的内容才进入总结阶段。
score_threshold: 7

# 推送 top N（Stage 3 用）。
top_n: 10
