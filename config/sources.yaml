# 默认信息源。用户在 fork 中可改这个文件来增删源。
sources:
  # ── 论文 / 学术（arXiv 科学分类） ──
  - name: arxiv-qbio
    type: arxiv
    categories: [q-bio.BM, q-bio.QM, q-bio.GN]
    max_results: 50

  - name: arxiv-physchem
    type: arxiv
    categories: [physics.chem-ph, physics.comp-ph, cond-mat.mtrl-sci]
    max_results: 50

  - name: arxiv-climate
    type: arxiv
    categories: [physics.ao-ph, physics.geo-ph]
    max_results: 50

  - name: arxiv-ml
    type: arxiv
    categories: [cs.LG, stat.ML, math.NA]
    max_results: 50

  # ── GitHub Topic 趋势（AI for Science） ──
  - name: github-trending-protein
    type: github
    topic: protein-structure-prediction
    min_stars: 10

  - name: github-trending-moleculardynamics
    type: github
    topic: molecular-dynamics
    min_stars: 10

  - name: github-trending-drugdiscovery
    type: github
    topic: drug-discovery
    min_stars: 5

  - name: github-trending-scientific-ml
    type: github
    topic: scientific-machine-learning
    min_stars: 5

  # ── 主要厂商 / 实验室 博客（AI for Science） ──
  - name: deepmind-blog
    type: rss
    url: https://deepmind.google/blog/rss.xml

  - name: google-research
    type: rss
    url: https://research.google/blog/rss/

  - name: microsoft-research
    type: rss
    url: https://www.microsoft.com/en-us/research/feed/

  - name: nvidia-dev-blog
    type: rss
    url: https://developer.nvidia.com/blog/feed/

  # ── 期刊 / 中文媒体 ──
  - name: nature
    type: rss
    url: https://www.nature.com/nature.rss

  - name: science
    type: rss
    url: https://www.science.org/rss/news_current.xml

  - name: qbitai
    type: rss
    url: https://www.qbitai.com/feed

  # ── 社区聚合 ──
  - name: hackernews-ai
    type: hackernews
    query: "AI for Science"
    min_points: 50
